<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Agent Desktop</title>
    <meta name="description" content="Hermes Agent Desktop - AI Agent for Windows" />
    <style>
      /* Custom titlebar styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        overflow: hidden;
      }

      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Titlebar drag region */
      .titlebar {
        -webkit-app-region: drag;
        height: 32px;
        background: #1e293b;
        display: flex;
        align-items: center;
        padding: 0 16px;
        user-select: none;
      }

      .titlebar-title {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
      }

      /* No-drag regions for buttons */
      .titlebar-button {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frontend/main.tsx"></script>
  </body>
</html>
