appId: com.hermes.agent.desktop
productName: Hermes Agent Desktop
copyright: Copyright © 2026 Hermes Agent

directories:
  output: release
  buildResources: src/assets

files:
  - dist/**/*
  - dist-electron/**/*
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - package.json

asar: true

extraResources:
  - from: src/python
    to: python
    filter:
      - "**/*"
  - from: src/assets
    to: assets
    filter:
      - "icon.png"
      - "icon.ico"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: src/assets/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"
  # No signing certificate configured
  signAndEditExecutable: false

portable:
  artifactName: "${productName}-${version}-Portable.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hermes Agent
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
  installerHeaderIcon: src/assets/icon.ico
  license: LICENSE
  installerLanguages:
    - en_US
    - id_ID

publish:
  provider: github
  owner: carly17s
  repo: hermes-windows
  releaseType: release
